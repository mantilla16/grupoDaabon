# Nginx snippet — pega dentro del `server { … }` de tu vhost.
# Ejemplo: /etc/nginx/sites-available/tuservidor.conf
#
# Layout esperado:
#   Frontend + API viven en el mismo proceso Node (puerto 4001).
#   Nginx solo hace reverse-proxy bajo /estructuradaabon/.
#
# Después de editar: `sudo nginx -t && sudo systemctl reload nginx`

location /estructuradaabon/ {
    # Note the trailing slash on `proxy_pass` — reescribe /estructuradaabon/*
    # como / al backend Node. El servidor Express sirve la build en dist/ y la
    # API bajo /api/*.  Detrás de nginx llegan como /estructuradaabon/api/*.
    proxy_pass http://127.0.0.1:4001/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /estructuradaabon;

    # WebSocket support (por si algún día se usa)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Assets con hash de contenido → cachear largo. El resto ya tiene
    # Cache-Control desde el server Node.
    proxy_buffering on;
}

# Redirect /estructuradaabon (sin slash final) al canonical con slash
# para que las URLs relativas del cliente resuelvan bien.
location = /estructuradaabon {
    return 301 /estructuradaabon/;
}
