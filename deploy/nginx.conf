# Nginx snippet — pegá dentro del `server { … }` de tu vhost, al lado del
# resto de las locations (misma altura que /checklist/, /reteica/, etc.).
#
# Después:
#   sudo nginx -t && sudo systemctl reload nginx
#
# El servidor Node/Express en 4001 sirve tanto el build de Vite como la API
# SQLite (/api/*), así que no hace falta root/alias — todo va por proxy_pass.

# Redirect sin slash → con slash (necesario para que rutas relativas resuelvan)
location = /estructuradaabon {
    return 301 /estructuradaabon/;
}

location /estructuradaabon/ {
    # El slash final en proxy_pass reescribe /estructuradaabon/* como /* al
    # backend. Así Express ve /api/graph (no /estructuradaabon/api/graph).
    proxy_pass http://127.0.0.1:4001/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
}
